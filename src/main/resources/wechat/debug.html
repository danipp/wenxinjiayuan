<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>微信[体验版] - 畅享优惠 一碰就好</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #00c250;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        /* Logo和标语样式 */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .alipay-logo {
            width: 120px;
            height: 120px;
            font-size: 140px;
            font-weight: bold;
            line-height: 1;
        }
        
        .slogan {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        
        /* 按钮样式 */
        .buttons-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 320px;
            gap: 15px;
            margin-bottom: 60px;
        }
        
        .alipay-button {
            padding: 15px 30px;
            background-color: white;
            color: #00c250;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .alipay-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .alipay-button:active {
            transform: translateY(0);
        }
        
        /* 底部信息样式 */
        .footer-info {
            text-align: center;
            font-size: 14px;
            width: 100%;
        }
        
        .developer-info {
            margin-bottom: 10px;
        }
        
        .version-info {
            margin-bottom: 10px;
        }
        
        .update-date {
            margin-bottom: 20px;
        }
        
        .links-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .link-item {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }
        
        .link-item:hover {
            text-decoration: underline;
        }
        
        .separator {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .icp-info {
            font-size: 12px;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .alipay-logo {
                width: 220px;
                height: 100px;
                font-size: 110px;
            }
            
            .slogan {
                font-size: 20px;
                margin-bottom: 30px;
            }
            
            .buttons-container {
                margin-bottom: 40px;
            }
            
            .alipay-button {
                font-size: 16px;
                padding: 12px 24px;
            }
            
            .links-container {
                gap: 10px;
            }
            
            .link-item {
                font-size: 12px;
            }
        }
    </style>

</head>
<body>

<div class="logo-container">
        <div class="alipay-logo">微信</div>
    </div>
    
    <div class="slogan">畅享优惠 一碰就好</div>
    
    <div class="buttons-container">
        <button class="alipay-button" onclick="javascript:location.href=myHref;">打开微信小程序</button>
        <button class="alipay-button" onclick="javascript:location.href=myHref;">Open Wechat APP</button>
    </div>
    
    <div class="footer-info">
        <div class="developer-info">友情提醒: 请允许打开微信</div>
        <div class="version-info">Tips: Please 'Continue' to Wechat</div>
        <div class="update-date">Updated: 2025/11/20</div>
        
        
        
        <div class="links-container">
            <div class="icp-info">圣达校园-TAG No. <span id="posIdSpan">16025414-9</span></div>
        </div>
    </div>
    
    <script type="text/javascript">
    function getQueryVariable(variable)
    {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i=0;i<vars.length;i++) {
            var pair = vars[i].split("=");
            if(pair[0] == variable){return pair[1];}
        }
        return(false);
    }
    var posId = getQueryVariable("posId");
    if(posId == false){
    	posId='0';
    }

    var span = document.getElementById('posIdSpan');
    span.innerHTML = posId;
	var myHref= 'weixin://dl/business/?appid=wxdbf23f5855ff108a&path=pages/coupon/index&query=type%3DNFC_WX_COUPON%26posId%3D'+posId+ '&env_version=trial';
// var myHref= 'weixin://dl/business/?appid=wx23b40d694fe6f5b8&path=me/coupon/index&query=type%3DNFC_WX_COUPON%26posId%3D'+posId;
	window.onload = function() {
		console.log('>> index onload myHref= '+myHref);
		location.href = myHref;
	//'weixin://dl/business/?appid=wx23b40d694fe6f5b8&path=me/coupon/index&query=type%3DNFC_WX_COUPON%26posId%3D123456'
};

</script>
     
</body>
</html>
